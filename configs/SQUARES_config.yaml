# =============================================================================
# SQUARES condition — adaptive staircase config
# =============================================================================
# Task: decide which side shows the ROTATED square.
#
# ALL TIME VALUES ARE IN VIDEO FRAMES.
# Assumes a 60 Hz display -> 1 frame ~ 16.67 ms.
# Running on any other refresh rate silently corrupts all timings.
# See the CAUTION block at the top of README.md.
# =============================================================================

# --- Training phase ----------------------------------------------------------
# Two lists of equal length describing the training blocks run before the
# adaptive staircase. Block i runs TRAINING_TRIALS[i] trials at a fixed
# SOA of TRAINING_SOAS[i] frames. Feedback is shown after every trial.
# Length equality is asserted at runtime (main.py).
TRAINING_TRIALS: [ 10, 10 ]   # 10 easy trials, then 10 harder trials
TRAINING_SOAS:   [ 12, 6 ]    # SOA per block: ~200 ms, then ~100 ms

# --- Adaptive (experimental) phase -------------------------------------------
START_SOA: 6                  # initial SOA for the staircase (~100 ms)

# --- UI ----------------------------------------------------------------------
MSG_TEXT_SIZE:     20         # font height (px) for instruction screens
FEEDBACK_HEIGHT:   40         # font height (px) for the per-trial feedback message
FEEDBACK_DURATION: 30         # how long the feedback is shown (frames)
FIX_HEIGHT:        100        # fixation '+' height (px)
ARROW_HEIGHT:      30         # response-arrow row height (px)
ARROW_POS_Y:       -200       # response-arrow vertical offset (px; 0 = screen centre)
QUESTION_HEIGHT:   20         # question-text height (px)
QUESTION_POS_Y:    -180       # question vertical offset (px; 0 = screen centre)

# --- Per-trial timing --------------------------------------------------------
FIX_TIME: 45                  # fixation cross duration  (~750 ms)
MTIME:    17                  # mask presentation time   (~283 ms)
RTIME:    240                 # max response time        (~4 s); timeout = wrong

# Inter-trial interval jitter, in frames. Each trial waits a random integer
# drawn from [min, max] frames (inclusive on both ends), divided by
# FRAME_RATE (see main.py). At 60 Hz this is ~750-1000 ms.
REST_TIME_RANGE: [ 45, 60 ]

# --- Staircase rule ----------------------------------------------------------
# Implemented in Adaptives/NUpNDown.py.
#   - N_UP correct in a row  -> SOA decreases by 1 frame (harder)
#   - N_DOWN wrong in a row  -> SOA increases by 1 frame (easier)
# With N_DOWN = 1 the rule converges on the SOA where the participant is
# correct with probability p satisfying p^N_UP = 0.5:
#   2/1 -> ~71% correct (standard 2-down-1-up)
#   3/1 -> ~79% correct
# The staircase ends after MAX_REVS reversals, so total trial count is
# variable.
MAX_REVS: 10
N_UP:     2
N_DOWN:   1
